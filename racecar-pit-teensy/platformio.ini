; PlatformIO project configuration.
; Reference: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

; Firmware. Build: pio run   Flash: pio run -t upload
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

lib_deps =
    fastled/FastLED @ ^3.10.3
    ftrias/TeensyThreads
    dimag0g/PPM-reader @ ^1.2.0
    robtillaart/INA226 @ ^0.6.6
    adafruit/Adafruit LSM9DS1 Library @ ^2.2.1
    majicdesigns/MD_MAX72XX @ ^3.5.1
    majicdesigns/MD_Parola @ ^3.7.5
    tomstewart89/BasicLinearAlgebra @ ^5.1

; Host unit tests over the Arduino-free logic in src/crc16.cpp and
; src/drive_map.cpp. Run: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<crc16.cpp> +<drive_map.cpp>
build_flags = -std=gnu++17 -Iinclude
