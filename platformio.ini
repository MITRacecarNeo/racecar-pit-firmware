; PlatformIO project configuration.
; Reference: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41
test_dir = tests

; Firmware. Build: pio run   Flash: pio run -t upload
; Versions are pinned so a rebuild of one commit gives the same firmware.
[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags =
    -Iconfig
    !python3 scripts/build_flags.py
lib_deps =
    fastled/FastLED @ 3.10.8
    ftrias/TeensyThreads @ 1.0.2
    dimag0g/PPM-reader @ 1.2.0
    robtillaart/INA226 @ 0.6.6
    adafruit/Adafruit LSM9DS1 Library @ 2.2.1
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit LIS3MDL @ 1.2.5
    adafruit/Adafruit Unified Sensor @ 1.1.15
    majicdesigns/MD_MAX72XX @ 3.5.1
    majicdesigns/MD_Parola @ 3.7.5

; Profiling build: the firmware above plus timing hooks reported on USB serial
; once per second. Flash: pio run -e teensy41_profile -t upload
; Capture: python3 scripts/profile_capture.py
[env:teensy41_profile]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -DRCN_PROFILE

; Host unit tests over the Arduino-free logic. Run: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<crc16.cpp> +<drive_map.cpp> +<battery.cpp> +<packets.cpp> +<info.cpp> +<prof_stats.cpp>
build_flags = -std=gnu++17 -Iconfig -Isrc
