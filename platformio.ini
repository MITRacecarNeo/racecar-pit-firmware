; PlatformIO project configuration.
; Reference: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41
test_dir = tests

; Firmware. Build: pio run   Flash: pio run -t upload
; Versions are pinned so a rebuild of one commit gives the same firmware.
[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
; The first write after a soft reboot fails on this board; scripts/upload.py
; reboots, writes, and retries.
upload_protocol = custom
upload_command = python3 scripts/upload.py --tools $PROJECT_PACKAGES_DIR/tool-teensy $SOURCE
platform_packages = platformio/tool-teensy
build_flags =
    -Iconfig
    !python3 scripts/build_flags.py
lib_deps =
    fastled/FastLED @ 3.10.8
    ftrias/TeensyThreads @ 1.0.2
    dimag0g/PPM-reader @ 1.2.0
    robtillaart/INA226 @ 0.6.6
    adafruit/Adafruit LSM9DS1 Library @ 2.2.1
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit LIS3MDL @ 1.2.5
    adafruit/Adafruit Unified Sensor @ 1.1.15
    majicdesigns/MD_MAX72XX @ 3.5.1
    majicdesigns/MD_Parola @ 3.7.5

; Profiling build: the firmware above plus timing hooks reported on USB serial
; once per second. Flash: pio run -e teensy41_profile -t upload
; Capture: python3 scripts/profile_capture.py
[env:teensy41_profile]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -DRCN_PROFILE

; Watchdog test build: profiling plus a USB serial command that stops one
; context, to check the reset. Never ship it.
[env:teensy41_wdt_test]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -DRCN_PROFILE
    -DRCN_WDT_TEST

; Speed-loop trace build: the firmware above plus the Teleplot-style trace of
; target speed, measured speed and ESC PWM on USB serial (RCN_SERIAL_PLOT).
; Flash: pio run -e teensy41_trace -t upload
[env:teensy41_trace]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -DRCN_SERIAL_PLOT

; Raw-PWM test build: a Pi command drives the ESC open loop at
; 1500 + command * 1000 us (limit +/- 300 us), for measuring the PWM-to-speed
; curve. Never ship it. Flash: pio run -e teensy41_raw_pwm -t upload
[env:teensy41_raw_pwm]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -DRCN_RAW_PWM

; ESC calibration build: holds the ESC at neutral, full forward or full
; reverse as scripts/esc_cal.py steps it over USB serial; no driving. Never
; ship it. Flash: pio run -e teensy41_esc_cal -t upload
[env:teensy41_esc_cal]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -DRCN_ESC_CAL

; Host unit tests over the Arduino-free logic. Run: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<crc16.cpp> +<drive_map.cpp> +<battery.cpp> +<packets.cpp> +<info.cpp> +<prof_stats.cpp> +<command_framer.cpp> +<esc_cal.cpp> +<start_assist.cpp> +<stall_guard.cpp> +<display_state.cpp> +<led_patterns.cpp>
build_flags = -std=gnu++17 -Iconfig -Isrc
